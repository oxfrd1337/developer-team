name: DT-001 safe-mode checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} / synthetic safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout without persisted write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint including security rules
        run: python -m ruff check developer_team tests
      - name: Check formatting
        run: python -m ruff format --check developer_team tests
      - name: Execute synthetic workflow and merge-safety tests
        run: python -m coverage run --branch -m unittest discover -s tests -t . -v
      - name: Report coverage
        run: python -m coverage report --fail-under=80
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Validate configuration and run safe smoke scenario
        env:
          DT_SMOKE_OUTPUT: ${{ runner.temp }}/dt-001-smoke
        run: |
          python -m developer_team validate examples/project.synthetic.toml
          python -m developer_team demo --scenario test-fix --output "$DT_SMOKE_OUTPUT"
      - name: Retain synthetic report (no cloud attestation)
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dt-001-synthetic-report
          path: ${{ runner.temp }}/dt-001-smoke/report.json
          retention-days: 7
