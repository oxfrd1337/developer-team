name: DT-017 temporary formatting evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  formatting-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.3
      - name: Emit formatting patch for local review (no repository writes)
        run: |
          python -m ruff check --fix developer_team tests || true
          python -m ruff format developer_team tests
          git diff > /tmp/dt017-format.patch
          python - <<'PY'
          import base64
          from pathlib import Path
          print('DT017_PATCH=' + base64.b64encode(Path('/tmp/dt017-format.patch').read_bytes()).decode())
          PY
